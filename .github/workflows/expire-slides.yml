name: Expire shared slides
on:
  schedule:
    - cron: "15 4 31 10 *"   # 00:15 EDT, Oct 31
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete /s and commit
        run: |
          if [ -d s ]; then
            git rm -r -q s
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git commit -m "Expire shared slides"
            git push
          fi
