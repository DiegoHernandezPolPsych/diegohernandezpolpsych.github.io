<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>GLI330 slides</title>
<link rel="icon" href="/favicon.svg" />
<link rel="stylesheet" href="/tokens.css" />
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; padding: 22px; }
main { max-width: 420px; text-align: center; }
h1 { font-family: var(--font-display, var(--font-body)); font-weight: 500; font-size: 1.6rem; margin: 0 0 8px; }
p { color: var(--faint); margin: 0 0 20px; }
a.btn { display: inline-block; background: var(--accent); color: var(--bg); text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 100px; }
[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <section id="live">
    <h1>GLI330 slides</h1>
    <p id="msg">Your download should start automatically.</p>
    <a class="btn" id="dl" href="GLI330_slides.pdf" download>Download PDF</a>
  </section>
  <section id="gone" hidden>
    <h1>This link has expired</h1>
    <p>These slides are no longer available. Please contact your instructor.</p>
  </section>
</main>
<script>
  // Access closes at midnight Eastern, end of Oct 30 2026.
  var EXPIRES = Date.parse("2026-10-31T00:00:00-04:00");
  if (Date.now() >= EXPIRES) {
    document.getElementById("live").hidden = true;
    document.getElementById("gone").hidden = false;
  } else {
    setTimeout(function () { document.getElementById("dl").click(); }, 300);
  }
</script>
</body>
</html>
